name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [main]
  # 允許在 GitHub 網頁的 Actions 頁籤手動觸發
  workflow_dispatch:

# 授予 GITHUB_TOKEN 部署 Pages 所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只允許一個部署，新的推送會取消排隊中的舊部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 不用 runner 快取的舊版，確保拿到最新的 22.x（含安全修補）
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx hexo clean && npx hexo generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
